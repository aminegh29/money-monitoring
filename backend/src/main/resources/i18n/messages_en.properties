s.habit4=Set budgets for the categories you want to cut, so the app warns you at 80%%.

# ---- Goal plan
g.status=**%s**: save **%s** by **%s**. Saved so far: **%s** (%s%%). Remaining: **%s** in **%s** months.
g.trackingAuto=Progress is estimated from your income minus your expenses since %s. Record deposits to track it exactly.
g.trackingManual=Progress is based on the %s deposits you recorded.
g.done=Congratulations, you reached this goal! Consider setting a new one or moving the money to a safe savings account.
g.overdue=The deadline has passed and **%s** is still missing.
g.overdueMonths=At your current pace you need about **%s** more months, so pick a new realistic date.
g.required=You need to save **%s** per month (%s%% of your income of **%s**).
g.avgOk=You currently save about **%s** per month, which is enough. Set an automatic transfer of **%s** on payday to stay on track.
g.avgGap=You currently save about **%s** per month, so you are **%s** short each month.
g.noIncome=Add your income so I can tell you how realistic this goal is.
g.split=That is about **%s** per week.
g.deposit=Each time you set money aside, record it as a deposit in the goal so you can see your progress.
g.cut=Cut **%s** by **%s** per month (%s%% of what you spend there).
g.extend=Move the deadline: at your current savings pace you'd reach the goal in about **%s** months.
g.lower=Or lower the target to about **%s**, which you can reach by the deadline at your current pace.
g.unrealistic=This goal needs more than half of your income. A longer deadline or extra income would make it much easier.
g.extraIncome=Boost your income: even **%s** extra per month from a side activity or selling unused items would close the gap.


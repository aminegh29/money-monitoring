# ---- Year review
y.empty=No expenses recorded in %s yet.
y.spent=You spent **%s** in total (about **%s** per month).
y.saved=You saved **%s** (%s%% of income).
y.mostExpensive=Most expensive month: **%s** (%s).
y.mostFrugal=Most frugal month: **%s** (%s). Look at what you did differently that month.
y.catLine=%s %s: %s (%s%% of the year)
y.raise=Raise your savings rate to 20%% next year. That means saving about **%s** per month.
y.excellent=Excellent savings rate. Consider putting part of your savings into long-term investments.
y.cap=Set a monthly cap for **%s**. A 10%% reduction would save **%s** per year.
y.seasonal=Plan for seasonal spikes (holidays, back to school, vacations) by saving a little every month ahead of time.
y.subs=Review subscriptions and recurring payments once a quarter and cancel what you no longer use.
y.emergency=Build or maintain an emergency fund of **%s** (3 months of average spending).


# ---- Monthly savings plan
s.noIncome=Add your income (or your expected monthly income in your profile) so I can build a savings plan.
s.noGoal=You haven't set a monthly savings goal yet. Following the 20%% rule, a good target for you is **%s** per month. You can set it in your profile.
s.status=Your goal is to save **%s** per month. With **%s** of income and **%s** spent so far this month, you are on course to save about **%s**.
s.avg=Over the last 3 months you saved **%s** per month on average.
s.onTrack=At this pace you reach your goal. Keep it up!
s.gap=You need about **%s** more per month to reach your goal.
s.cutCat=Reduce **%s** by **%s** per month (from %s to %s).
s.goalTooHigh=Your goal is %s%% of your income. Even after these cuts it may be hard to reach, so start with a first milestone of **%s** per month.
s.payFirst=Pay yourself first: move **%s** to a savings account on payday, before spending anything.
s.allowance=After essentials (about **%s**) and your savings goal, you can spend about **%s** per month on everything else, which is **%s** per week.
s.allowanceNegative=Your essential costs plus your savings goal are higher than your income. Lower fixed costs first (housing, subscriptions, energy) or lower the goal for now.
s.habit1=Review your spending every Sunday in the app (5 minutes is enough).

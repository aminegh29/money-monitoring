<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Money Monitor promo composition</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #04050d; }
  body { font-family: Inter, 'Segoe UI', sans-serif; color: #eef1ff; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #04050d; }
  #bg, #scenes, #fx { position: absolute; inset: 0; }
  .blob { position: absolute; width: 1300px; height: 1300px; border-radius: 50%; margin: -650px 0 0 -650px; }
  .floor { position: absolute; left: -50%; width: 200%; height: 1000px; bottom: -380px; transform: perspective(700px) rotateX(72deg);
    background-image: linear-gradient(rgba(139,92,246,.55) 2px, transparent 2px), linear-gradient(90deg, rgba(34,211,238,.4) 2px, transparent 2px);
    background-size: 90px 90px; -webkit-mask-image: linear-gradient(to top, #000 10%, transparent 75%); }
  .horizon { position: absolute; left: 0; right: 0; top: 760px; height: 2px; background: linear-gradient(90deg, transparent, #8b5cf6, #22d3ee, #e879f9, transparent); box-shadow: 0 0 40px 10px rgba(139,92,246,.45); }
  .particle { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #b9a8ff; box-shadow: 0 0 10px #8b5cf6; }
  .scene { position: absolute; inset: 0; display: none; }
  .grad { background: linear-gradient(120deg, #22d3ee 0%, #8b5cf6 52%, #e879f9 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }

  .cap { position: absolute; font-family: 'Space Grotesk', Inter, sans-serif; }
  .cap-title { font-weight: 700; letter-spacing: -0.045em; line-height: 1.02; }
  .cap-title .w { display: inline-block; margin-right: .22em; will-change: transform; }
  .cap-title .br { display: block; height: 0; }
  .cap-sub { font-family: Inter, sans-serif; font-size: 30px; color: #a9b0d6; margin-top: 18px; letter-spacing: -0.01em; }
  .center { text-align: center; }

  .lower { position: absolute; left: 70px; bottom: 64px; padding: 24px 34px 26px 38px; border-radius: 26px; background: rgba(9,11,28,.88);
    border: 1px solid rgba(255,255,255,.14); box-shadow: 0 30px 80px -20px rgba(0,0,0,.9), 0 0 60px rgba(139,92,246,.25); max-width: 1000px; }
  .lower::before { content: ''; position: absolute; left: 0; top: 22px; bottom: 22px; width: 5px; border-radius: 0 5px 5px 0; background: linear-gradient(#22d3ee, #8b5cf6, #e879f9); box-shadow: 0 0 18px #8b5cf6; }
  .lower .cap-title { font-family: 'Space Grotesk', sans-serif; font-size: 58px; }
  .lower .cap-sub { font-size: 24px; margin-top: 8px; }

  .win { position: absolute; border-radius: 22px; overflow: hidden; background: #05060f;
    box-shadow: 0 60px 140px -30px rgba(0,0,0,.95), 0 0 0 1.5px rgba(255,255,255,.14), 0 0 90px rgba(139,92,246,.28); }
  .win-inner { width: 100%; height: 100%; will-change: transform; }
  .win img, .scr img { width: 100%; height: 100%; display: block; object-fit: cover; object-position: top; }
  .paper { position: absolute; border-radius: 10px; overflow: hidden; background: #fff; box-shadow: 0 40px 100px -20px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.2); }
  .paper img { width: 100%; height: 100%; display: block; }

  .phone { position: absolute; border-radius: 52px; padding: 11px; background: linear-gradient(145deg, #353b5c, #0b0d1c);
    box-shadow: 0 0 0 2px rgba(255,255,255,.1), 0 60px 120px -30px rgba(0,0,0,.95), 0 0 80px rgba(139,92,246,.35); }
  .phone .scr { width: 100%; height: 100%; border-radius: 42px; overflow: hidden; background: #000; }
  .phone::after { content: ''; position: absolute; top: 22px; left: 50%; width: 96px; height: 28px; margin-left: -48px; border-radius: 20px; background: #000; }

  .laptop { position: absolute; }
  .lap-screen { border-radius: 22px 22px 0 0; padding: 16px; background: linear-gradient(160deg, #262b45, #0d0f20); border: 1.5px solid #34395a; }
  .lap-screen .win { position: relative; border-radius: 8px; box-shadow: none; }
  .lap-base { height: 26px; margin: 0 -7%; border-radius: 0 0 26px 26px; background: linear-gradient(#3a3f5e, #12142a); box-shadow: 0 40px 80px -10px rgba(0,0,0,.9); }

  .pill { position: absolute; white-space: nowrap; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 28px; padding: 14px 24px; border-radius: 999px;
    background: rgba(12,14,34,.92); border: 1.5px solid rgba(255,255,255,.18); box-shadow: 0 20px 50px -10px rgba(0,0,0,.8), 0 0 40px rgba(139,92,246,.35); }
  .pill.hot { background: linear-gradient(120deg, #22d3ee, #8b5cf6 55%, #e879f9); border: none; color: #fff; box-shadow: 0 0 50px rgba(139,92,246,.7); }
  .pill.big { font-size: 46px; padding: 22px 40px; }
  .label { position: absolute; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 34px; text-align: center; width: 600px; margin-left: -300px; }

  .chipx { position: absolute; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 30px; padding: 16px 24px; border-radius: 20px;
    background: rgba(14,16,38,.9); border: 1.5px solid rgba(255,255,255,.16); box-shadow: 0 0 40px rgba(139,92,246,.3); white-space: nowrap; }
  .chipx b { color: #ff7aa0; margin-left: 14px; }

  .orb { position: absolute; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #c9f7ff, #22d3ee 18%, #8b5cf6 52%, #e879f9 80%);
    box-shadow: 0 0 120px 30px rgba(139,92,246,.6), 0 0 260px 80px rgba(34,211,238,.25); }
  .bubble { position: absolute; font-size: 30px; padding: 18px 26px; border-radius: 26px 26px 26px 6px; background: rgba(14,16,38,.92); border: 1.5px solid rgba(255,255,255,.16); white-space: nowrap; }
  .bubble.me { border-radius: 26px 26px 6px 26px; background: linear-gradient(120deg, #22d3ee, #8b5cf6 55%, #e879f9); border: none; color: #fff; }
  .ring { position: absolute; border-radius: 50%; border: 3px solid rgba(139,92,246,.7); box-shadow: 0 0 40px rgba(139,92,246,.6), inset 0 0 40px rgba(34,211,238,.3); }
  .divider { position: absolute; width: 4px; background: linear-gradient(#22d3ee, #8b5cf6, #e879f9); box-shadow: 0 0 30px 6px rgba(139,92,246,.8); }
  .knob { position: absolute; width: 74px; height: 74px; margin-left: -37px; border-radius: 50%; display: grid; place-items: center; font-size: 34px;
    background: rgba(12,14,34,.95); border: 2px solid rgba(255,255,255,.3); box-shadow: 0 0 40px rgba(139,92,246,.8); }
  .watermark { position: absolute; left: 44px; top: 34px; display: flex; align-items: center; gap: 14px; font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 500; }
  #flash { position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, #ffffff, #c4b5fd 35%, rgba(139,92,246,.4) 70%, transparent); pointer-events: none; }
  #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55)); pointer-events: none; }
  #black { position: absolute; inset: 0; background: #000; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="scenes"></div>
  <div id="fx"><div id="vignette"></div><div id="flash"></div><div id="black"></div></div>
</div>
<script>
const W = 1920, H = 1080, S = 'shots/';
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const E = {
  outExpo: (t) => (t === 1 ? 1 : 1 - Math.pow(2, -10 * t)),
  outCubic: (t) => 1 - Math.pow(1 - t, 3),
  inCubic: (t) => t * t * t,
  inOut: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
  outBack: (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  lin: (t) => t,
};
const P = (t, a, b, e = E.outCubic) => e(clamp((t - a) / (b - a)));
const inDrop = (t) => (t >= 8 && t < 60) || (t >= 68 && t < 116);
const kick = (t) => (inDrop(t) ? Math.exp(-(t % 0.5) / 0.09) : 0);

function el(tag, cls, parent, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  if (parent) parent.appendChild(e);
  return e;
}
function at(e, x, y, w, h) {
  e.style.left = x + 'px'; e.style.top = y + 'px';
  if (w) e.style.width = w + 'px';
  if (h) e.style.height = h + 'px';
  return e;
}

// ---------------------------------------------------------------- building blocks
function win(parent, src, x, y, w, h) {
  const root = at(el('div', 'win', parent), x, y, w, h);
  const inner = el('div', 'win-inner', root);
  el('img', '', inner).src = S + src;
  return { root, inner };
}
function pan(w, kfs, t) {
  let v = kfs[kfs.length - 1].slice(1);
  if (t <= kfs[0][0]) v = kfs[0].slice(1);
  else for (let i = 0; i < kfs.length - 1; i++) {
    const a = kfs[i], b = kfs[i + 1];
    if (t <= b[0]) { const k = E.inOut((t - a[0]) / (b[0] - a[0])); v = [lerp(a[1], b[1], k), lerp(a[2], b[2], k), lerp(a[3], b[3], k)]; break; }
  }
  w.inner.style.transformOrigin = `${v[0] * 100}% ${v[1] * 100}%`;
  w.inner.style.transform = `scale(${v[2]})`;
}
function phone(parent, src, x, y, w = 320) {
  const h = Math.round(w * 2.165);
  const root = at(el('div', 'phone', parent), x, y, w, h);
  el('img', '', el('div', 'scr', root)).src = S + src;
  return root;
}
function laptop(parent, src, x, y, w) {
  const root = at(el('div', 'laptop', parent), x, y);
  const scr = el('div', 'lap-screen', root);
  const wn = win(scr, src, 0, 0, w, Math.round(w * 0.625));
  el('div', 'lap-base', root);
  return { root, win: wn };
}
function caption(parent, title, { x, y, size = 96, sub = null, align = 'left', subSize = null }) {
  const c = el('div', 'cap' + (align === 'center' ? ' center' : ''), parent);
  if (align === 'center') { c.style.left = '0'; c.style.width = W + 'px'; } else c.style.left = x + 'px';
  c.style.top = y + 'px';
  const h = el('div', 'cap-title', c);
  h.style.fontSize = size + 'px';
  c.words = [];
  for (const raw of title.split(' ')) {
    if (raw === '|') { el('span', 'br', h); continue; }
    // *text* inside a word gets the neon gradient (works for whole words and parts like Money*Monitor*)
    c.words.push(el('span', 'w', h, raw.replace(/\*([^*]+)\*/g, '<span class="grad">$1</span>')));
  }
  if (sub) { c.sub = el('div', 'cap-sub', c, sub); if (subSize) c.sub.style.fontSize = subSize + 'px'; }
  return c;
}
function showCaption(c, lt, t0, t1) {
  const out = 1 - P(lt, t1 - 0.3, t1, E.inCubic);
  c.words.forEach((s, i) => {
    const k = P(lt, t0 + i * 0.07, t0 + i * 0.07 + 0.55, E.outExpo);
    s.style.opacity = k * out;
    s.style.transform = `translateY(${(1 - k) * 70}px) rotate(${(1 - k) * 4}deg)`;
  });
  if (c.sub) {
    const k = P(lt, t0 + 0.3, t0 + 0.9) * out;
    c.sub.style.opacity = k;
    c.sub.style.transform = `translateY(${(1 - k) * 20}px)`;
  }
}
function lower(parent, title, sub) {
  const box = el('div', 'lower', parent);
  const c = caption(box, title, { x: 0, y: 0, size: 58, sub });
  c.style.position = 'relative';
  box.cap = c;
  return box;
}
function showLower(box, lt, t0, t1) {
  const k = P(lt, t0, t0 + 0.6, E.outExpo) * (1 - P(lt, t1 - 0.3, t1, E.inCubic));
  box.style.opacity = k;
  box.style.transform = `translateX(${(1 - k) * -60}px)`;
  showCaption(box.cap, lt, t0 + 0.1, t1);
}
function pill(parent, html, x, y, cls = '') { return at(el('div', 'pill ' + cls, parent, html), x, y); }
function showPill(p, lt, t0, t1, dy = 24) {
  const k = P(lt, t0, t0 + 0.5, E.outBack);
  const o = clamp(P(lt, t0, t0 + 0.25)) * (1 - P(lt, t1 - 0.25, t1));
  p.style.opacity = o;
  p.style.transform = `translateY(${(1 - k) * dy}px) scale(${0.8 + 0.2 * k})`;
}
function enter(e, lt, t0, { dx = 0, dy = 0, rx = 0, ry = 0, rz = 0, s = 1, dur = 0.9, base = '' } = {}) {
  const k = P(lt, t0, t0 + dur, E.outExpo);
  e.style.opacity = clamp(P(lt, t0, t0 + 0.3));
  e.style.transform = `${base} translate3d(${(1 - k) * dx}px, ${(1 - k) * dy}px, 0) rotateX(${(1 - k) * rx}deg) rotateY(${(1 - k) * ry}deg) rotateZ(${(1 - k) * rz}deg) scale(${lerp(s, 1, k)})`;
  return k;
}

// ---------------------------------------------------------------- background
const bg = document.getElementById('bg');
const blobs = [
  ['rgba(139,92,246,.42)', 0.25, 0.25], ['rgba(34,211,238,.28)', 0.8, 0.3], ['rgba(232,121,249,.3)', 0.6, 0.9],
].map(([c, x, y]) => { const b = el('div', 'blob', bg); b.style.background = `radial-gradient(circle, ${c}, transparent 62%)`; b.bx = x; b.by = y; return b; });
const floor = el('div', 'floor', bg);
const horizon = el('div', 'horizon', bg);
const particles = Array.from({ length: 70 }, (_, i) => {
  const p = el('div', 'particle', bg);
  p.sx = (Math.sin(i * 12.9898) * 43758.5453) % 1; p.sx = Math.abs(p.sx);
  p.sy = Math.abs((Math.sin(i * 78.233) * 12345.678) % 1);
  p.v = 18 + (i % 7) * 9; p.size = 2 + (i % 4);
  p.style.width = p.style.height = p.size + 'px';
  return p;
});
const water = el('div', 'watermark', bg, `<img src="../frontend/public/logo.svg" width="44" height="44"><span>Money<b class="grad">Monitor</b></span>`);

function updateBg(t) {
  const k = kick(t);
  blobs.forEach((b, i) => {
    const x = (b.bx + 0.08 * Math.sin(t * 0.21 + i * 2)) * W, y = (b.by + 0.07 * Math.cos(t * 0.17 + i)) * H;
    b.style.transform = `translate(${x}px, ${y}px) scale(${1 + 0.08 * k + 0.05 * Math.sin(t * 0.3 + i)})`;
  });
  // The neon floor is the hero of "cinematic" moments, dimmed while app screens are on.
  const cinematic = t < 12 || (t >= 60 && t < 64) || (t >= 78 && t < 80) || t >= 116;
  const fo = cinematic ? 1 : 0.28;
  floor.style.opacity = fo * (0.75 + 0.25 * k);
  horizon.style.opacity = fo * (0.7 + 0.3 * k);
  floor.style.backgroundPosition = `0 ${(t * 160) % 90}px, ${(t * 12) % 90}px 0`;
  particles.forEach((p) => {
    const x = (p.sx * W + Math.sin(t * 0.5 + p.sy * 10) * 30);
    const y = H - ((p.sy * H + t * p.v) % (H + 40));
    p.style.transform = `translate(${x}px, ${y}px)`;
    p.style.opacity = 0.35 + 0.5 * Math.abs(Math.sin(t * 1.3 + p.sx * 20));
  });
  water.style.opacity = t > 12.4 && t < 115.6 ? 0.85 : 0;
  const fl = [12, 68, 116].reduce((a, d) => (t >= d ? Math.max(a, Math.exp(-(t - d) / 0.22)) : a), 0);
  document.getElementById('flash').style.opacity = 0.85 * fl;
  document.getElementById('black').style.opacity = clamp(1 - t / 0.6) + P(t, 119.1, 120, E.lin);
}

// ---------------------------------------------------------------- scenes
const scenes = [];
function scene(start, end, build) {
  const root = el('div', 'scene', document.getElementById('scenes'));
  const s = { start, end, root };
  s.update = build(root, end - start);
  scenes.push(s);
}

// 0 · Intro
scene(0, 6, (r, D) => {
  const logo = el('div', '', r);
  logo.style.position = 'absolute';
  at(logo, 860, 230, 200, 200);
  logo.innerHTML = `<svg width="200" height="200" viewBox="0 0 64 64"><defs><linearGradient id="g0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#e879f9"/></linearGradient></defs>
    <rect x="1" y="1" width="62" height="62" rx="17" fill="rgba(10,12,30,.85)" stroke="url(#g0)" stroke-opacity=".7" stroke-width="1.5"/>
    <path id="mpath" d="M15 44V22l9 12 8-12 8 12 9-12v22" fill="none" stroke="url(#g0)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="120" stroke-dashoffset="120"/>
    <circle id="mdot" cx="49" cy="15" r="4" fill="#22d3ee" opacity="0"/></svg>`;
  logo.style.filter = 'drop-shadow(0 0 40px rgba(139,92,246,.8))';
  const rings = [0, 1].map(() => el('div', 'ring', r));
  const title = caption(r, 'Money *Monitor*', { align: 'center', y: 480, size: 150 });
  const tag = caption(r, 'Money, at the speed of *light.*', { align: 'center', y: 690, size: 56 });
  return (lt) => {
    const k = P(lt, 0.2, 1.4, E.outExpo);
    logo.style.opacity = k;
    logo.style.transform = `scale(${0.6 + 0.4 * k}) rotate(${(1 - k) * -20}deg)`;
    logo.querySelector('#mpath').setAttribute('stroke-dashoffset', 120 * (1 - P(lt, 0.4, 2.0, E.inOut)));
    logo.querySelector('#mdot').setAttribute('opacity', P(lt, 1.9, 2.2));
    rings.forEach((g, i) => {
      const rk = P(lt, 0.6 + i * 1.6, 2.6 + i * 1.6, E.outCubic);
      const sz = 200 + rk * 1200;
      at(g, 960 - sz / 2, 330 - sz / 2, sz, sz);
      g.style.opacity = (1 - rk) * (lt > 0.6 + i * 1.6 ? 1 : 0);
    });
    showCaption(title, lt, 1.6, D + 0.3);
    title.style.letterSpacing = `${lerp(0.25, 0, P(lt, 1.6, 3.2, E.outExpo))}em`;
    showCaption(tag, lt, 3.2, D + 0.3);
    const out = P(lt, D - 0.4, D, E.inCubic);
    r.style.transform = `scale(${1 + out * 0.3})`;
  };
});

// 1 · Hook
scene(6, 12, (r, D) => {
  const items = [['☕ Coffee', '-32'], ['🛒 Groceries', '-201'], ['🍔 Burger', '-62'], ['🚕 Taxi', '-45'], ['🎬 Cinema', '-120'], ['📱 Subscription', '-65'], ['👟 Sneakers', '-1,250'], ['💡 Electricity', '-380']];
  const chips = items.map(([a, b], i) => {
    const c = el('div', 'chipx', r, `${a}<b>${b} MAD</b>`);
    const ang = (i / items.length) * Math.PI * 2;
    c.hx = 960 + Math.cos(ang) * 700 - 150; c.hy = 520 + Math.sin(ang) * 380 - 30;
    return c;
  });
  const q1 = caption(r, 'Where did your', { align: 'center', y: 330, size: 120 });
  const q2 = caption(r, '*money* *go?*', { align: 'center', y: 470, size: 170 });
  const a1 = caption(r, 'Find *out.*', { align: 'center', y: 350, size: 140 });
  const a2 = caption(r, 'In *real* *time.*', { align: 'center', y: 520, size: 140 });
  return (lt, t) => {
    chips.forEach((c, i) => {
      const k = P(lt, 0.2 + i * 0.12, 0.8 + i * 0.12, E.outBack);
      const suck = P(lt, 2.6, 3.1, E.inCubic);
      const x = lerp(c.hx + Math.sin(t * 1.2 + i) * 18, 860, suck), y = lerp(c.hy + Math.cos(t * 1.1 + i) * 14, 500, suck);
      c.style.opacity = clamp(k) * (1 - suck);
      c.style.transform = `translate(${x}px, ${y}px) rotate(${Math.sin(i * 3) * 8 * (1 - suck)}deg) scale(${(0.6 + 0.4 * k) * (1 - 0.7 * suck)})`;
    });
    showCaption(q1, lt, 0.15, 3.0);
    showCaption(q2, lt, 0.8, 3.0);
    showCaption(a1, lt, 3.1, D + 0.2);
    showCaption(a2, lt, 3.7, D + 0.2);
    r.style.transform = `scale(${1 + 0.012 * kick(t)})`;
  };
});

// 2 · Meet Money Monitor (drop)
scene(12, 18, (r, D) => {
  r.style.perspective = '2200px';
  const cap = caption(r, 'Meet *Money* *Monitor*', { align: 'center', y: 46, size: 92, sub: 'Track · Save · Grow · on Web, iOS & Android' });
  const lap = laptop(r, 'landing.png', 290, 300, 1040);
  const ph = phone(r, 'm-dashboard.png', 1420, 290, 300);
  return (lt, t) => {
    showCaption(cap, lt, 0.1, D + 0.3);
    const k = P(lt, 0, 1.4, E.outExpo);
    lap.root.style.transform = `translateY(${(1 - k) * 260}px) rotateX(${lerp(40, 7, k)}deg) rotateY(${lerp(-10, 6, P(lt, 0, D, E.lin))}deg)`;
    lap.root.style.opacity = clamp(k * 1.5);
    pan(lap.win, [[0, 0.3, 0.3, 1], [D, 0.3, 0.32, 1.12]], lt);
    enter(ph, lt, 0.9, { dx: 400, ry: -40, rz: 8 });
    ph.style.transform += ` rotateY(-12deg) translateY(${Math.sin(t * 1.6) * 10}px)`;
  };
});

// 3 · Accounts (coverflow)
scene(18, 26, (r, D) => {
  r.style.perspective = '2000px';
  const cap = caption(r, 'Join in | *seconds.*', { x: 110, y: 250, size: 100 });
  const bullets = ['🔐 Encrypted passwords · JWT', '✉️ Password reset by email', '⚡ One-tap demo account', '🛡️ User & Admin roles']

// ---------------------------------------------------------------- driver
window.render = (t) => {
  updateBg(t);
  for (const s of scenes) {
    const D = s.end - s.start, lt = t - s.start;
    const vis = t >= s.start && t < s.end + 0.3;
    s.root.style.display = vis ? 'block' : 'none';
    if (!vis) continue;
    s.update(lt, t);
    // crossfade: each scene fades in on its cut and lingers 0.3 s into the next one
    const inK = P(lt, 0, 0.35, E.outCubic), outK = P(lt, D - 0.05, D + 0.3, E.inCubic);
    s.root.style.opacity = s.start === 0 ? 1 - outK : inK * (1 - outK);
    s.root.style.zIndex = s.start;
  }
};
window.ready = (async () => {
  await document.fonts.ready;
  await Promise.all([...document.images].map((i) => (i.complete ? i.decode().catch(() => {}) : new Promise((r) => { i.onload = i.onerror = r; }))));
  window.render(0);
  return true;
})();
